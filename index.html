<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三宅小学校 天気・環境情報</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { 
            font-family: 'BIZ UDPGothic', 'BIZ UDGothic', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; 
            background-color: #eef2f5; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }
        .weather-icon-shadow { text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .leaflet-container { border-radius: 1rem; background: #d4dadc !important; }
    </style>
</head>
<body class="flex flex-col p-2 h-screen">
    
    <!-- Header -->
    <header class="flex-none flex justify-between items-center mb-2 pb-1 border-b-2 border-gray-300">
        <h1 class="text-4xl font-black text-[#4255a4] tracking-tight">三宅小学校 気象情報</h1>
        <p id="current-datetime" class="text-4xl font-bold text-gray-600 tracking-tighter"></p>
    </header>

    <!-- Main Section -->
    <div class="flex-grow grid grid-cols-12 gap-3 min-h-0 mb-3">
        
        <!-- Left Side (Weather + Indices + Warnings) -->
        <div class="col-span-8 flex flex-col gap-3 h-full">
            
            <div class="flex gap-3 h-[70%]">
                <!-- Today's Weather -->
                <div class="flex-[2] rounded-2xl shadow-lg bg-white p-3 flex flex-col items-center justify-between border-2 border-blue-50 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                    <h2 class="text-2xl font-black text-gray-400">今日の天気</h2>
                    <div id="today-icon-container" class="text-9xl leading-none weather-icon-shadow my-1"></div>
                    <div class="text-center w-full">
                        <p id="today-detail" class="text-2xl font-bold text-gray-700 truncate px-1"></p>
                        <div id="today-temp" class="tracking-tighter"></div>
                    </div>
                </div>

                <!-- Tomorrow's Weather -->
                <div class="flex-[2] rounded-2xl shadow-lg bg-white p-3 flex flex-col items-center justify-between border-2 border-blue-50 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-blue-300"></div>
                    <h2 class="text-2xl font-black text-gray-400">明日の天気</h2>
                    <div id="tomorrow-icon-container" class="text-9xl leading-none weather-icon-shadow my-1"></div>
                    <div class="text-center w-full">
                        <p id="tomorrow-detail" class="text-2xl font-bold text-gray-700 truncate px-1"></p>
                        <div id="tomorrow-temp" class="tracking-tighter"></div>
                    </div>
                </div>

                <!-- Environmental Indices -->
                <div class="flex-1 flex flex-col gap-3">
                    <!-- WBGT -->
                    <div id="card-wbgt" class="flex-1 bg-white rounded-2xl shadow p-2 text-center border-l-8 border-gray-200 flex flex-col justify-center transition-all">
                        <h3 class="text-sm font-bold text-gray-400 leading-none mb-1">暑さ指数</h3>
                        <div id="env-wbgt" class="flex flex-col">...</div>
                    </div>
                    <!-- PM2.5 -->
                    <div id="card-pm25" class="flex-1 bg-white rounded-2xl shadow p-2 text-center border-l-8 border-gray-200 flex flex-col justify-center transition-all">
                        <h3 class="text-sm font-bold text-gray-400 leading-none mb-1">PM2.5</h3>
                        <div id="env-pm25" class="flex flex-col">...</div>
                    </div>
                    <!-- Dust (Yellow Sand) -->
                    <div id="card-sand" class="flex-1 bg-white rounded-2xl shadow p-2 text-center border-l-8 border-gray-200 flex flex-col justify-center transition-all">
                        <h3 class="text-sm font-bold text-gray-400 leading-none mb-1">黄砂</h3>
                        <div id="env-sand" class="flex flex-col">...</div>
                    </div>
                </div>
            </div>

            <!-- Warning Panel -->
            <div class="flex-grow min-h-0">
                <div id="warning-panel" class="w-full h-full rounded-2xl shadow-md bg-white p-2 flex justify-center items-center">
                    <p class="text-lg font-bold text-gray-400">取得中...</p>
                </div>
            </div>
        </div>

        <!-- Right Side (Radar + Overview) -->
        <div class="col-span-4 flex flex-col gap-3 h-full">
            <div id="radar-container" class="flex-[3] rounded-2xl shadow-lg bg-white relative border-2 border-white min-h-0">
                <div class="absolute top-2 left-2 z-[400] bg-white/90 backdrop-blur-sm px-2 py-0.5 rounded-lg shadow text-xs font-bold text-gray-800 border">
                    📡 雨雲レーダー (5分更新)
                </div>
                <div id="map" class="w-full h-full rounded-2xl"></div>
            </div>
            
            <div class="flex-[2] rounded-2xl shadow-lg bg-white p-3 relative overflow-hidden flex flex-col min-h-0 border-t-4 border-gray-400">
                <h3 class="text-sm font-bold text-gray-400 mb-1">気象概況</h3>
                <div class="overflow-y-auto flex-grow text-lg font-bold text-gray-600 leading-snug no-scrollbar" id="weather-overview">
                    <p class="text-gray-300 text-sm">読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Hourly Forecast -->
    <div class="flex-none h-[250px] bg-white rounded-2xl shadow-lg p-3 relative overflow-hidden border-t-4 border-blue-500">
        <div class="overflow-x-auto overflow-y-hidden h-full no-scrollbar">
            <div id="hourly-forecast-container" class="flex gap-3 h-full">
                <p class="text-gray-400 text-sm">データを取得中...</p>
            </div>
        </div>
    </div>

    <script>
        const LOCATION_LAT = 34.5717;
        const LOCATION_LON = 135.7764;
        const JMA_OFFICE_CODE = '290000';
        const JMA_AREA_CODE = '290010';
        const MIYAKE_AREA_CODE = '2936200';
        const OPEN_METEO_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION_LAT}&longitude=${LOCATION_LON}&hourly=temperature_2m,relative_humidity_2m,shortwave_radiation,wind_speed_10m,weathercode&timezone=Asia%2FTokyo`;

        const WEATHER_ICONS = { 100: '☀️', 101: '🌤️', 102: '🌦️', 103: '☀️', 104: '🌨️', 110: '🌤️', 200: '☁️', 202: '🌧️', 300: '☂️', 400: '☃️' };
        const WMO_ICONS = { 0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 51: '🌧️', 61: '☂️', 71: '☃️', 80: '🌧️', 95: '🌩️' };

        function calculateWBGT(t, h, s, w) {
            const tw = t * Math.atan(0.151977 * Math.pow(h + 8.313659, 0.5)) + Math.atan(t + h) - Math.atan(h - 1.676331) + 0.00391838 * Math.pow(h, 1.5) * Math.atan(0.023101 * h) - 4.686035;
            let tg = t + (Math.max(0, (0.018 * s) - (0.8 * w)));
            return Math.round(0.7 * tw + 0.2 * tg + 0.1 * t);
        }

        // 判定ラベル取得用関数
        function getLevel(type, val) {
            if (type === 'WBGT') {
                if (val >= 31) return { text: "危険", color: "text-purple-600", border: "border-purple-500" };
                if (val >= 28) return { text: "厳重警戒", color: "text-red-600", border: "border-red-500" };
                if (val >= 25) return { text: "警戒", color: "text-orange-600", border: "border-orange-500" };
                if (val >= 21) return { text: "注意", color: "text-yellow-600", border: "border-yellow-500" };
                return { text: "ほぼ安全", color: "text-blue-600", border: "border-blue-500" };
            }
            if (type === 'PM25') {
                if (val >= 70) return { text: "非常に多い", color: "text-purple-600", border: "border-purple-500" };
                if (val >= 35) return { text: "多い", color: "text-red-600", border: "border-red-500" };
                if (val >= 25) return { text: "やや多い", color: "text-orange-600", border: "border-orange-500" };
                if (val >= 15) return { text: "普通", color: "text-yellow-600", border: "border-yellow-500" };
                return { text: "少ない", color: "text-blue-600", border: "border-blue-500" };
            }
            if (type === 'SAND') {
                if (val >= 50) return { text: "非常に多い", color: "text-purple-600", border: "border-purple-500" };
                if (val >= 30) return { text: "多い", color: "text-red-600", border: "border-red-500" };
                if (val >= 15) return { text: "やや多い", color: "text-orange-600", border: "border-orange-500" };
                if (val >= 5) return { text: "普通", color: "text-yellow-600", border: "border-yellow-500" };
                return { text: "少ない", color: "text-blue-600", border: "border-blue-500" };
            }
        }

        function updateClock() {
            const n = new Date();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            document.getElementById('current-datetime').textContent = `${n.getMonth()+1}/${n.getDate()}(${days[n.getDay()]}) ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
        }

        let map, radarLayer;
        
        function initRadar() {
            if (map) return;
            map = L.map('map', { 
                zoomControl: false, 
                attributionControl: false,
                minZoom: 5,
                maxZoom: 12,
                fadeAnimation: false
            }).setView([LOCATION_LAT, LOCATION_LON], 10);
            
            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { opacity: 0.8 }).addTo(map);

            map.whenReady(() => {
                updateRadarLayer();
                setTimeout(() => {
                    map.invalidateSize();
                    map.fire('moveend'); 
                }, 500);
            });

            setInterval(updateRadarLayer, 300000);

            L.marker([LOCATION_LAT, LOCATION_LON], { 
                icon: L.divIcon({ 
                    className: '', 
                    html: '<div class="w-4 h-4 bg-red-500 rounded-full border-2 border-white shadow-md animate-ping"></div>' 
                }) 
            }).addTo(map);
        }

        async function updateRadarLayer() {
            try {
                const res = await fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json');
                const data = await res.json();
                if (!data || data.length === 0) return;
                const baseTime = data[0].basetime;
                const validTime = data[0].validtime;
                if (radarLayer) { map.removeLayer(radarLayer); }
                const cacheBuster = new Date().getTime();
                radarLayer = L.tileLayer(`https://www.jma.go.jp/bosai/jmatile/data/nowc/${baseTime}/none/${validTime}/surf/hrpns/{z}/{x}/{y}.png?v=${cacheBuster}`, {
                    opacity: 0.6,
                    zIndex: 100,
                    tileSize: 256,
                    updateWhenIdle: false,
                    updateWhenZooming: true
                }).addTo(map);
            } catch (e) { console.error("Radar Update Error:", e); }
        }

        async function updateData() {
            try {
                const fRes = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${JMA_OFFICE_CODE}.json`);
                const fData = await fRes.json();
                const miyakeF = fData[0].timeSeries[0].areas.find(a => a.area.code === JMA_AREA_CODE);
                
                document.getElementById('today-icon-container').textContent = WEATHER_ICONS[miyakeF.weatherCodes[0]] || '☁️';
                document.getElementById('today-detail').textContent = miyakeF.weathers[0].replace(/　/g, '');
                document.getElementById('tomorrow-icon-container').textContent = WEATHER_ICONS[miyakeF.weatherCodes[1]] || '☁️';
                document.getElementById('tomorrow-detail').textContent = miyakeF.weathers[1].replace(/　/g, '');

                const omRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOCATION_LAT}&longitude=${LOCATION_LON}&current=temperature_2m,relative_humidity_2m,shortwave_radiation,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`);
                const om = await omRes.json();
                
                document.getElementById('today-temp').innerHTML = `<span class="text-4xl font-black text-red-500">${Math.round(om.daily.temperature_2m_max[0])}<span class="text-xl">℃</span></span><span class="text-gray-300 mx-1">/</span><span class="text-4xl font-black text-blue-500">${Math.round(om.daily.temperature_2m_min[0])}<span class="text-xl">℃</span></span>`;
                document.getElementById('tomorrow-temp').innerHTML = `<span class="text-4xl font-black text-red-500">${Math.round(om.daily.temperature_2m_max[1])}<span class="text-xl">℃</span></span><span class="text-gray-300 mx-1">/</span><span class="text-4xl font-black text-blue-500">${Math.round(om.daily.temperature_2m_min[1])}<span class="text-xl">℃</span></span>`;

                // 指数表示の更新 (WBGT)
                const wVal = calculateWBGT(om.current.temperature_2m, om.current.relative_humidity_2m, om.current.shortwave_radiation, om.current.wind_speed_10m);
                const wLv = getLevel('WBGT', wVal);
                document.getElementById('card-wbgt').className = `flex-1 bg-white rounded-2xl shadow p-2 text-center border-l-8 ${wLv.border} flex flex-col justify-center transition-all`;
                document.getElementById('env-wbgt').innerHTML = `<span class="${wLv.color} text-base font-bold">${wLv.text}</span><span class="${wLv.color} text-5xl font-black leading-none">${wVal}</span>`;

                // 指数表示の更新 (PM2.5 / Sand)
                const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LOCATION_LAT}&longitude=${LOCATION_LON}&current=pm10,pm2_5&timezone=Asia%2FTokyo`);
                const aq = await aqRes.json();
                
                const pVal = Math.round(aq.current.pm2_5);
                const pLv = getLevel('PM25', pVal);
                document.getElementById('card-pm25').className = `flex-1 bg-white rounded-2xl shadow p-2 text-center border-l-8 ${pLv.border} flex flex-col justify-center transition-all`;
                document.getElementById('env-pm25').innerHTML = `<span class="${pLv.color} text-base font-bold">${pLv.text}</span><div class="${pLv.color}"><span class="text-4xl font-black">${pVal}</span><span class="text-xs font-bold ml-0.5">μg</span></div>`;
                
                const sVal = Math.round(aq.current.pm10);
                const sLv = getLevel('SAND', sVal);
                document.getElementById('card-sand').className = `flex-1 bg-white rounded-2xl shadow p-2 text-center border-l-8 ${sLv.border} flex flex-col justify-center transition-all`;
                document.getElementById('env-sand').innerHTML = `<span class="${sLv.color} text-base font-bold">${sLv.text}</span><div class="${sLv.color}"><span class="text-4xl font-black">${sVal}</span><span class="text-xs font-bold ml-0.5">μg</span></div>`;

                const ovRes = await fetch(`https://www.jma.go.jp/bosai/forecast/data/overview_forecast/${JMA_OFFICE_CODE}.json`);
                const ov = await ovRes.json();
                const cleanText = ov.text.replace(/\n\s*\n/g, '\n').replace(/\n/g, '<br>');
                document.getElementById('weather-overview').innerHTML = cleanText;

                const panel = document.getElementById('warning-panel');
                try {
                    const wngRes = await fetch(`https://www.jma.go.jp/bosai/warning/data/warning/${JMA_OFFICE_CODE}.json`);
                    const wng = await wngRes.json();
                    let miyakeW = Array.isArray(wng) ? wng[0]?.timeSeries?.[0]?.areas?.find(a => a.area.code === MIYAKE_AREA_CODE) : wng.timeSeries?.[0]?.areas?.find(a => a.area.code === MIYAKE_AREA_CODE);
                    if (!miyakeW || !miyakeW.warnings || miyakeW.warnings.filter(w => w.status === "発表" || w.status === "継続").length === 0) {
                        panel.className = "w-full h-full rounded-2xl bg-green-50 border-2 border-green-200 flex justify-center items-center";
                        panel.innerHTML = '<span class="text-2xl font-black text-green-600">🟢 異常なし</span>';
                    } else {
                        const activeW = miyakeW.warnings.filter(w => w.status === "発表" || w.status === "継続");
                        panel.className = "w-full h-full rounded-2xl bg-red-50 border-2 border-red-300 flex justify-center items-center flex-wrap gap-2 p-1 overflow-y-auto no-scrollbar";
                        panel.innerHTML = activeW.map(w => `<span class="text-sm font-bold bg-red-500 text-white px-2 py-0.5 rounded shadow-sm">⚠️${w.name}</span>`).join('');
                    }
                } catch (e) { panel.innerHTML = '<span class="text-gray-400 text-xs">警報データ取得エラー</span>'; }

                const hrRes = await fetch(OPEN_METEO_URL);
                const hr = await hrRes.json();
                let hrHtml = '';
                const hNow = new Date().getHours();
                for (let i = 0; i < 24; i++) {
                    const idx = i + hNow;
                    if (!hr.hourly || !hr.hourly.time[idx]) break;
                    const hTime = new Date(hr.hourly.time[idx]).getHours();
                    const hT = Math.round(hr.hourly.temperature_2m[idx]);
                    const hW = calculateWBGT(hT, hr.hourly.relative_humidity_2m[idx], hr.hourly.shortwave_radiation[idx], hr.hourly.wind_speed_10m[idx]);
                    const hLv = getLevel('WBGT', hW);
                    hrHtml += `
                        <div class="flex flex-col items-center justify-between min-w-[135px] bg-gray-50 rounded-2xl p-3 border-2 border-gray-100 shadow-sm h-full">
                            <span class="text-lg font-black text-gray-500">${hTime}時</span>
                            <span class="text-5xl my-1">${WMO_ICONS[hr.hourly.weathercode[idx]] || '☁️'}</span>
                            <span class="text-3xl font-black text-gray-700">${hT}<span class="text-sm font-bold">℃</span></span>
                            <div class="w-full text-center p-1 rounded-lg border ${hLv.border.replace('border-', 'border-opacity-30 border-')} bg-white flex flex-col items-center">
                                <span class="text-[10px] font-bold ${hLv.color} leading-none">暑さ指数</span>
                                <span class="text-xl font-black ${hLv.color}">${hW}</span>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('hourly-forecast-container').innerHTML = hrHtml;
            } catch (e) { console.error("UpdateData Error:", e); }
        }

        window.onload = () => {
            updateClock(); setInterval(updateClock, 1000);
            initRadar(); updateData();
            setInterval(updateData, 600000);
        };
    </script>
</body>
</html>
